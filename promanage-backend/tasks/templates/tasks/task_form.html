{% extends "base/base.html" %}

{% block content %}
<h1>{% if form.instance.pk %}Modifier{% else %}Créer{% endif %} une Tâche</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Enregistrer</button>
  <a href="{% url 'task_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
