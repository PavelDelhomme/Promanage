{% extends "base.html" %}

{% block content %}
<div class="form-container">
  <h2>{% if form.instance.pk %}Modifier{% else %}Créer{% endif %} Projet</h2>
  <form method="post">
    {% csrf_token %}
    
    <div class="form-grid">
      <div class="form-group">
        <label>Titre</label>
        {{ form.title }}
      </div>
      
      <div class="form-group">
        <label>Catégorie</label>
        {{ form.category }}
      </div>
      
      <div class="form-group">
        <label>Statut</label>
        {{ form.status }}
      </div>
      
      <div class="form-group">
        <label>Dates</label>
        <div class="date-fields">
          {{ form.start_date }}
          {{ form.end_date }}
        </div>
      </div>
      
      <div class="form-group full-width">
        <label>Description</label>
        {{ form.description }}
      </div>
      
      <div class="form-group">
        <label>Public</label>
        {{ form.is_public }}
      </div>
    </div>
    
    <button type="submit" class="btn">Enregistrer</button>
  </form>
</div>
{% endblock %}
