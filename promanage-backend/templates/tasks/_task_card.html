<div class="task-card">
    <h3>{{ task.title }}</h3>
    <div class="task-meta">
      <span class="project">{{ task.project.title }}</span>
      <span class="due-date">{{ task.due_date|date:"d/m/Y" }}</span>
    </div>
    <p>{{ task.description|truncatechars:100 }}</p>
    <div class="task-actions">
      <a href="{% url 'task_update' task.id %}">Modifier</a>
      <a href="{% url 'task_delete' task.id %}">Supprimer</a>
    </div>
  </div>
